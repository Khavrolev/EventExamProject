services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5455:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5454:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5456:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-service:
    build:
      context: .
      dockerfile: services/Users/Dockerfile
    container_name: eventapi-users-service
    ports:
      - "5001:5001"
    environment:
      - ConnectionStrings__DefaultConnection=Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:-super_secret_jwt_key_for_microservices_exam_2026_test_token_secret!}
      - Jwt__Issuer=EventExamProject
      - Jwt__Audience=EventExamProject.Clients
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      users-db:
        condition: service_healthy

  events-service:
    build:
      context: .
      dockerfile: services/Events/Dockerfile
    container_name: eventapi-events-service
    ports:
      - "5002:5002"
    environment:
      - ConnectionStrings__DefaultConnection=Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:-super_secret_jwt_key_for_microservices_exam_2026_test_token_secret!}
      - Jwt__Issuer=EventExamProject
      - Jwt__Audience=EventExamProject.Clients
      - Kafka__BootstrapServers=kafka:29092
      - Kafka__ConsumerGroup=events-consumer-group
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookings-service:
    build:
      context: .
      dockerfile: services/Bookings/Dockerfile
    container_name: eventapi-bookings-service
    ports:
      - "5003:5003"
    environment:
      - ConnectionStrings__DefaultConnection=Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:-super_secret_jwt_key_for_microservices_exam_2026_test_token_secret!}
      - Jwt__Issuer=EventExamProject
      - Jwt__Audience=EventExamProject.Clients
      - Kafka__BootstrapServers=kafka:29092
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      events-service:
        condition: service_started

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
